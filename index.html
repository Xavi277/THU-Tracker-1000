<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1019">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UTH Tracker">
  <meta name="description" content="Registro local de rondas y análisis estadístico de Ultimate Texas Hold'em.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <title>UTH Tracker — Registro y estadística</title>
</head>
<body>
  <div id="app">
    <header class="topbar"><div class="brand"><span class="brand-mark">♠</span><span><strong>UTH TRACKER</strong><small>Registro · Análisis</small></span></div><span id="save-status" class="save-chip">Cargando…</span></header>
    <main id="view" class="view" aria-live="polite"></main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Navegación principal"></nav>
    <div id="card-picker"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="import-file" type="file" accept=".json,application/json" hidden>
  </div>
  <script src="./app.js"></script>
</body>
</html>
